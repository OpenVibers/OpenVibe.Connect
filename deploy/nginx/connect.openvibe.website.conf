## ═══════════════════════════════════════════════════════════════
## OpenVibe Connect — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/connect.openvibe.website.conf (ov-vhost-install). The file name keeps the
## original host; the Node app (port 5240, systemd unit openvibe-connect) serves four kinds of host:
##
##   connect.openvibe.link                 canonical: the pages, the API, sign-in, and the computers' tunnel (WebSocket /tunnel)
##   <label>--<user>.openvibe.link         canonical share hosts: the gate, then the tunnel to that person's computer
##   connect.openvibe.website              the old control name: pages 302 to Link; /tunnel still answers
##   <label>--<user>.openvibe.website      the old share names: still served, and 302 to Link when CONNECT_REDIRECT_LEGACY=1
##
## Every other *.openvibe.website host is OpenVibe.Space's (deploy/nginx/openvibe.website.conf in OpenVibe.Space),
## whose server_name leaves out any host with "--" in it: a Space site's name can never contain "--", so the two never
## meet. connect.openvibe.website is an exact name and wins over Space's pattern anyway. A *.openvibe.link host without
## "--" is not a Connect host: the Link apex stays Network's.
##
## A share streams: no proxy buffering either way (server-sent events, uploads), WebSocket upgrades pass, and a
## connection may stay open for an hour. The app sets every cache header itself (a share is never cached by
## Cloudflare: Cloudflare-CDN-Cache-Control: no-store). Never log request bodies, query strings or cookies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=connect_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=connect_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=connect_tunnel:10m rate=30r/m;

map $http_upgrade $connect_connection {
    default upgrade;
    ''      close;
}

# The access log for shares keeps no query string (a share's URLs are someone else's app's).
log_format connect_share '$remote_addr - [$time_local] "$request_method $host$uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name connect.openvibe.website connect.openvibe.link ~^[a-z0-9-]+--[a-z0-9-]+\.openvibe\.link$ ~^[a-z0-9-]+--[a-z0-9-]+\.openvibe\.website$;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── connect.openvibe.website (old control name; pages 302 to Link) ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name connect.openvibe.website;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.website/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/connect.openvibe.website.access.log;
    error_log  /var/log/nginx/connect.openvibe.website.error.log;

    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── A computer connecting a share: one long WebSocket (the server pings every 25 s) ──
    location = /tunnel {
        limit_req zone=connect_tunnel burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connect_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:5240;
    }

    location = /auth/me {
        limit_req zone=connect_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5240;
    }

    location /auth/ {
        limit_req zone=connect_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5240;
    }

    location /api/ {
        limit_req zone=connect_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5240;
    }

    location ~* ^/metrics(/|$) { return 404; }
    location ~* ^/internal(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:5240;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── <label>--<user>.openvibe.website: an old share alias ──────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^[a-z0-9-]+--[a-z0-9-]+\.openvibe\.website$;

    ssl_certificate     /etc/letsencrypt/live/openvibe.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.website/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/connect-shares.access.log connect_share;
    error_log  /var/log/nginx/connect-shares.error.log;

    # Connect counts a body against its own cap (100 MB); Cloudflare's own cap is the same.
    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connect_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:5240;
    }
}

